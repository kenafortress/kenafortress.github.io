<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kena | Teaching jobs, bursaries and marking in South Africa</title>
<meta name="description" content="Every teaching opportunity in South Africa in one place: urgent posts, formal posts, marking, bursaries and study. Free, checked and updated every few days.">
<meta name="theme-color" content="#3A1A5C">
<link rel="icon" href="kena-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kenafortress.github.io/">
<meta property="og:title" content="Kena: every teaching opportunity in one place">
<meta property="og:description" content="Teaching posts, marking, bursaries and study in South Africa. Free, checked and updated every few days.">
<meta property="og:image" content="https://kenafortress.github.io/kena-share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script data-goatcounter="https://kenafortress.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<style>
:root{
  --plum:#3A1A5C;--plum2:#5B2C8D;--violet:#7A3FB0;--lilac:#F3ECFA;--lilac2:#E8DDF4;
  --gold:#F2D06B;--gold2:#D9A522;--amber:#F7F0DC;--amberInk:#7A5410;
  --ink:#1E1530;--muted:#6E6380;--faint:#9A8DAC;--line:#EEE8F4;--bg:#FFFFFF;--hot:#B3311A;--ok:#2F6B3A;
  --r:16px;--navh:68px;
  --font:"Lexend","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom))}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:var(--plum2)}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bars */
.hero{background:var(--plum);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 22px;border-radius:0 0 28px 28px}
.hero .top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:19px;color:inherit;text-decoration:none}
.brand svg{width:30px;height:30px}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px}
.hero .iconbtn{color:var(--gold)}
.hero h1{font-weight:500;font-size:clamp(25px,7vw,30px);letter-spacing:-.01em;margin:20px 0 14px;line-height:1.15}
.searchbox{text-decoration:none;display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:0 14px;height:52px;color:#8A7A9E;width:100%;text-align:left;font-weight:300}
.searchbox input{border:0;outline:0;flex:1;min-width:0;height:100%;background:none;font-weight:400;font-size:16px}
.pills{display:flex;gap:8px;margin-top:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;font-size:14px;padding:7px 14px;border-radius:20px;border:1px solid #6B4A8F;color:#E8DDF4;white-space:nowrap}
.pill.on{background:var(--gold);color:var(--plum);border-color:var(--gold);font-weight:500}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.bar .row{display:flex;align-items:center;gap:8px}
.bar h2{font-size:19px;font-weight:600}
.bar .searchbox{background:var(--lilac);height:48px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:10px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;font-size:14px;padding:7px 12px;border-radius:20px;border:1px solid var(--lilac2);background:#fff;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--plum);border-color:var(--plum);color:#fff}
.chip .x{font-size:15px;line-height:1;opacity:.8}

/* sections and rows */
main{padding:6px 20px 20px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 4px;gap:12px}
.sec h3{font-size:18px;font-weight:600}
.sec a,.sec button{font-size:14px;color:var(--violet);text-decoration:none;white-space:nowrap}
.sub{font-size:14px;color:var(--muted);margin-bottom:4px}
.rows{list-style:none;margin:0;padding:0}
.rows li{border-bottom:1px solid var(--line)}
.row{display:flex;gap:14px;align-items:center;padding:13px 0;width:100%;text-align:left}
.date{width:52px;height:56px;border-radius:12px;background:var(--amber);color:var(--amberInk);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
.date b{font-size:20px;font-weight:600}
.date i{font-style:normal;font-size:12px;margin-top:3px}
.date.hot{background:#FBE3DC;color:var(--hot)}
.date.gen{background:var(--lilac);color:var(--plum2)}
.tx{flex:1;min-width:0}
.tx h4{font-size:15.5px;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.tx p{font-size:13.5px;color:var(--muted);font-weight:300;margin:2px 0 3px;overflow-wrap:anywhere}
.due{font-size:12.5px;color:var(--plum2);font-weight:500}
.due.hot{color:var(--hot)}
.due.closed{color:var(--faint)}
.heart{width:44px;height:44px;display:grid;place-items:center;color:#B5A8C6;flex:none;margin-right:-10px}
.heart.on{color:var(--hot)}
.heart.on .ico{fill:currentColor}
.empty{background:var(--lilac);border-radius:var(--r);padding:18px;margin:14px 0;font-size:15px;color:#3A2A50}
.empty h4{font-size:16px;font-weight:600;margin-bottom:4px}
.card{background:var(--lilac);border-radius:var(--r);padding:16px 18px;margin-top:18px;font-size:14.5px;line-height:1.55;color:#3A2A50}
.card h4{font-size:16px;font-weight:600;color:var(--ink);margin-bottom:4px}
.card .go{display:inline-block;margin-top:8px;color:var(--plum2);font-weight:600;text-decoration:none}
.card.gold{background:var(--amber);color:#4A3510}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:92px}
.tile b{font-size:22px;font-weight:600;color:var(--plum)}
.tile span{font-size:13px;color:var(--muted);line-height:1.35}
.more{display:block;width:100%;margin:14px 0 4px;padding:13px;border-radius:12px;background:var(--lilac);color:var(--plum);font-weight:500;text-align:center}
.foot{font-size:13px;color:var(--muted);margin:28px 0 8px;line-height:1.6}
.foot a{color:var(--plum2)}

/* bottom nav */
.bn{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bn .wrap{display:flex;justify-content:space-around;height:var(--navh);align-items:center}
.bn a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--faint);text-decoration:none;min-width:58px;padding:6px 0}
.bn a.on{color:var(--plum);font-weight:600}

/* detail */
.detail{padding:4px 20px 30px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.tag{font-size:12.5px;padding:4px 10px;border-radius:8px;background:var(--lilac);color:var(--plum2)}
.tag.gold{background:var(--gold);color:#3B2A05}
.tag.hot{background:#FBE3DC;color:var(--hot)}
.detail h1{font-size:24px;font-weight:600;line-height:1.2;letter-spacing:-.01em;overflow-wrap:anywhere}
.detail .org{color:var(--muted);margin:6px 0 14px;font-size:15px}
.count{display:flex;align-items:center;gap:12px;background:var(--amber);border-radius:14px;padding:12px 14px;color:#4A3510;font-size:14.5px}
.count b{font-size:20px;font-weight:600;color:var(--amberInk)}
.count.hot{background:#FBE3DC;color:#5A1A0E}
.count.hot b{color:var(--hot)}
.blk{margin-top:18px}
.blk h3{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:4px}
.blk p{font-size:15.5px;line-height:1.6;overflow-wrap:anywhere}
.contact{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.cline{display:flex;align-items:center;gap:10px;background:var(--lilac);border-radius:12px;padding:10px 12px;overflow-wrap:anywhere}
.cline a{flex:1;min-width:0;font-weight:500;text-decoration:none;color:var(--plum)}
.cline .ico{color:var(--plum2)}
.copy{font-size:13px;font-weight:600;color:var(--plum2);border:1.5px solid var(--lilac2);background:#fff;border-radius:9px;padding:6px 10px;flex:none}
.warn{background:#FBF1EC;border-left:4px solid var(--hot);padding:10px 13px;border-radius:8px;font-size:14.5px;margin-top:16px}
.actions{display:flex;gap:10px;margin-top:22px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;background:var(--plum);color:#fff;font-weight:500;text-decoration:none;font-size:15px}
.btn.ghost{background:#fff;color:var(--plum);border:1.5px solid var(--lilac2)}
.btn.gold{background:var(--gold);color:var(--plum)}
.src{font-size:13px;color:var(--faint);margin-top:18px;line-height:1.5}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(30,21,48,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:#fff;border-radius:24px 24px 0 0;max-height:82vh;overflow:auto;transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility .25s;padding:10px 20px calc(20px + env(safe-area-inset-bottom))}
.sheet.on{transform:none;visibility:visible}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:#D7CDE3;margin:0 auto 14px}
.sheet h3{font-size:19px;font-weight:600;margin-bottom:10px}
.opts{display:flex;flex-direction:column}
.opt{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line);text-align:left;font-size:15.5px}
.opt span{color:var(--faint);font-size:13.5px}
.opt.on{color:var(--plum);font-weight:600}
.opt.on::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--gold2);margin-left:10px}
.pickgrid{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.pick{padding:9px 13px;border-radius:12px;border:1.5px solid var(--lilac2);font-size:14.5px}
.pick.on{background:var(--plum);border-color:var(--plum);color:#fff}
.lbl{font-size:14px;font-weight:600;margin:12px 0 4px;color:var(--muted)}

/* map */
.mapwrap{display:flex;flex-direction:column;max-width:720px;margin:0 auto;height:calc(100vh - var(--navh) - env(safe-area-inset-bottom));height:calc(100dvh - var(--navh) - env(safe-area-inset-bottom))}
.mapstage{position:relative;flex:1 1 auto;min-height:250px;overflow:hidden;background:radial-gradient(130% 100% at 25% 15%,#F6F1FB 0%,#E7DFF2 70%,#DDD3EC 100%)}
#map{position:absolute;left:8px;right:8px;top:calc(60px + env(safe-area-inset-top));bottom:50px}
#map svg,.minimap svg{width:100%;height:100%;display:block;overflow:visible}
.pv{stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer;transition:opacity .25s;outline:none}
.pv:hover,.pv:focus-visible{stroke:var(--gold2);stroke-width:3.5}
.pv.dim{opacity:.32}
.pv.sel{stroke:var(--plum);stroke-width:2.5;cursor:default}
.pv.sel:hover,.pv.sel:focus-visible{stroke:var(--plum);stroke-width:2.5}
.plab{pointer-events:none}
.plab rect{fill:#fff;stroke:var(--plum);stroke-width:1.5;vector-effect:non-scaling-stroke}
.plab .pc{font-family:var(--font);font-weight:600;fill:var(--plum);text-anchor:middle}
.plab .pn{font-family:var(--font);font-weight:500;fill:#2E2140;text-anchor:middle;paint-order:stroke;stroke:rgba(255,255,255,.92);stroke-linejoin:round}
.tdot{fill:var(--gold);stroke:var(--plum);stroke-width:1.2;vector-effect:non-scaling-stroke;pointer-events:none}
.spot{cursor:pointer;outline:none}
.spot circle{fill:var(--gold);stroke:var(--plum);stroke-width:2;vector-effect:non-scaling-stroke}
.spot.on circle,.spot:focus-visible circle{fill:var(--plum);stroke:var(--gold)}
.spot.on .sc,.spot:focus-visible .sc{fill:var(--gold)}
.spot .sc{font-family:var(--font);font-weight:700;fill:var(--plum);text-anchor:middle;pointer-events:none}
.spot .sn{font-family:var(--font);font-weight:500;fill:#2E2140;paint-order:stroke;stroke:rgba(255,255,255,.92);stroke-linejoin:round}
.sea{font-family:var(--font);font-size:17px;font-style:italic;fill:#A597BA;letter-spacing:.03em;pointer-events:none}
.sea.land{font-size:14px;fill:#B7ABC8}
.nring{fill:rgba(122,63,176,.10);stroke:var(--plum2);stroke-width:2;vector-effect:non-scaling-stroke;stroke-dasharray:6 5;pointer-events:none}
.nme{fill:#fff;stroke:var(--plum);stroke-width:3;vector-effect:non-scaling-stroke;pointer-events:none}
.mapbar{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;z-index:5;display:flex;gap:8px;align-items:center}
.mapbar .brand{background:var(--plum);color:#fff;border-radius:12px;padding:8px 12px;font-size:16px;margin-right:auto}
.mapbar .brand svg{width:22px;height:22px}
.mapbar .near{background:#fff;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:500;color:var(--plum);box-shadow:0 2px 8px rgba(58,26,92,.18);display:flex;gap:6px;align-items:center;white-space:nowrap}
.mapbar .near[hidden]{display:none}
.mapbar .near .ico{width:18px;height:18px}
@media (max-width:380px){.mapbar .brand span{display:none}}
.maplegend{position:absolute;left:14px;bottom:26px;display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted)}
.maplegend i{width:18px;height:9px;border-radius:2px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(58,26,92,.14)}
.maplegend[hidden]{display:none}
.maplegend span:first-child{margin-right:3px}.maplegend span:last-child{margin-left:3px}
.mapsheet{position:relative;z-index:6;flex:0 1 auto;max-height:50%;overflow:auto;margin-top:-18px;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -4px 18px rgba(58,26,92,.14);padding:16px 18px 12px}
.mapsheet h3{font-size:18px;font-weight:600}
.mapsheet .pick{padding:6px 11px;font-size:13.5px;background:#fff;white-space:nowrap}
.mapsheet .pick b{font-weight:600;color:var(--plum2);margin-left:2px}
.mapsheet .pick.on{background:var(--plum);border-color:var(--plum);color:#fff}
.mapsheet .pick.on b{color:var(--gold)}
.pickgrid.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:8px -18px 4px;padding:0 18px 2px}
.pickgrid.scroll::-webkit-scrollbar{display:none}
.rad{display:flex;background:var(--lilac);border-radius:10px;padding:3px;gap:2px}
.rad button{font-size:13px;padding:6px 10px;border-radius:8px;color:#5E4A78}
.rad button.on{background:var(--plum);color:var(--gold);font-weight:600}
.msh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.maphint{font-size:13.5px;color:var(--muted);margin:4px 0 6px}
.linkbtn{color:var(--plum2);font-size:13.5px;text-decoration:underline}
.minicard{display:block;text-decoration:none;color:inherit;margin-top:18px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:linear-gradient(180deg,#F6F1FB 0%,#EDE5F6 100%);box-shadow:0 1px 2px rgba(58,26,92,.05),0 8px 20px rgba(58,26,92,.06)}
.minicard .minimap{height:210px;padding:14px 10px 4px}
.minicard .cap{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;padding:12px 16px;font-size:14.5px}
.minicard .cap b{font-weight:600;color:var(--ink)}
.minicard .cap span{color:var(--violet);font-size:14px;white-space:nowrap}
/* polish */
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 150% at 88% -20%,#6B34A3 0%,#3A1A5C 52%,#2C1247 100%)}
.hero>.wrap{position:relative;z-index:1}
.hero::before,.hero::after{content:"";position:absolute;right:-46px;top:-58px;width:210px;height:210px;border:2px solid rgba(242,208,107,.16);border-radius:18px;pointer-events:none}
.hero::after{transform:rotate(45deg)}
.tile{box-shadow:0 1px 2px rgba(58,26,92,.05),0 6px 16px rgba(58,26,92,.05);border-top:3px solid var(--gold)}
.tile b{font-size:25px}
.rows li{transition:background .12s}
.rows li:active{background:#FAF7FD}
.bn a.on{position:relative}
.bn a.on::before{content:"";position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--gold2)}

/* guides */
.glist a{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.glist .gi{width:44px;height:44px;border-radius:12px;background:var(--lilac);color:var(--plum2);display:grid;place-items:center;flex:none}
.glist h4{font-size:15.5px;font-weight:500}
.glist p{font-size:13.5px;color:var(--muted);font-weight:300}
.prose{padding:6px 20px 30px}
.prose h1{font-size:24px;font-weight:600;line-height:1.2;margin:4px 0 8px}
.prose h2{font-size:18px;font-weight:600;margin:26px 0 8px}
.prose p{font-size:15.5px;line-height:1.65;margin:0 0 10px}
.prose ul,.prose ol{padding-left:22px;margin:6px 0 10px}
.prose li{font-size:15.5px;line-height:1.6;margin-bottom:8px}
.prose .lead{color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:14px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:8px 8px 8px 0;border-bottom:2px solid var(--line)}
.tbl td{padding:10px 8px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.total td{font-weight:600}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;padding:15px 0;font-weight:500;font-size:15.5px;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--violet);font-size:20px;line-height:1}
details[open] summary::after{content:"\2212"}
details ol{margin:0 0 14px;padding-left:22px}
.plinks a{display:block;padding:13px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.plinks b{display:block;font-weight:500}
.plinks span{font-size:13.5px;color:var(--muted)}

/* forms */
.form{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted)}
.form input,.form select,.form textarea{border:1.5px solid var(--lilac2);border-radius:12px;padding:12px;font-size:16px;background:#fff}
.tick{flex-direction:row!important;align-items:flex-start;gap:10px!important;color:var(--ink)!important}
.tick input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--plum)}
.out{width:100%;min-height:180px;border:1.5px solid var(--lilac2);border-radius:12px;padding:12px;background:var(--lilac);font-size:14px;margin-top:12px}
.err{color:var(--hot);font-weight:500;font-size:14px;margin-top:8px}
.code{display:inline-block;font-weight:700;font-size:26px;letter-spacing:.05em;color:var(--plum);background:var(--amber);border:2px solid var(--gold2);border-radius:10px;padding:6px 14px;margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(var(--navh) + 16px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:90}
.toast.on{opacity:1;transform:translateX(-50%)}

,"town":"Aggeneys","prov":"nc","kind":"teach","ptype":"Private school","subjects":[],"phases":["Foundation","Intermediate"],"grades":"","lang":"","what":"A Cambridge school (Grade 00 to A Levels) on a zinc mine in Aggeneys, about 3 hours west of Upington, wants two class teachers from January 2027: one for Grades 4 to 6 and one for Grade 1 or 2.","who":"Qualified class teachers. The village is very isolated.","when":"No closing date given","how":"Apply through Placements in Education: https://www.placementsineducation.co.za (search the post title). The agency does not name the school.","emails":[],"phones":[],"url":"https://www.placementsineducation.co.za","caution":"This agency post was listed in early November. It may already be filled. Never pay to be placed.","salary":"","source":"Placements in Education","speed":"formal","stages":["new","teaching"],"paths":["rooted","growing","moving","open"],"expires":"2026-12-20","closes":"","closeTime":"","start":"January 2027","id":"fe68bbcc","seen":"2026-11-22","lat":-29.24,"lng":18.84},{"title":"Head of IT and Innovation, and IT technician (GDE primary school)","org":"School via Placements in Education","town":"Ekurhuleni","prov":"gp","kind":"teach","ptype":"","subjects":["Information Technology"],"phases":[],"grades":"","lang":"","what":"A GDE primary school in Ekurhuleni that uses Google Workspace and Microsoft wants a Head of IT and Innovation and an IT technician.","who":"Head of IT: a BEd, or a BIT with PGCE, plus SACE registration. IT technician: a suitable diploma, 2 years of work experience and a police clearance.","when":"No closing date given","how":"Apply through Placements in Education: https://www.placementsineducation.co.za (search the post title). The agency does not name the school.","emails":[],"phones":[],"url":"https://www.placementsineducation.co.za","caution":"This agency post was listed in early November. It may already be filled. Never pay to be placed.","salary":"","source":"Placements in Education","speed":"formal","stages":["teaching","beyond"],"paths":["rooted","growing","moving","open"],"expires":"2026-12-20","closes":"","closeTime":"","start":"","id":"52bcc747","seen":"2026-11-22","lat":-26.15,"lng":28.3}],"content":{"STAGES":[{"id":"school","label":"Still at school or deciding"},{"id":"studying","label":"Studying now"},{"id":"new","label":"Just qualified"},{"id":"teaching","label":"Teaching already"},{"id":"beyond","label":"Looking past the classroom"}],"PATHS":[{"id":"rooted","label":"One school, long term","line":"You want a home. A school where you know every learner's name and you grow inside it.","steps":["Get onto your province's database and stay on it. Permanent posts are filled from there.","Get into a school you like through a contract post, but ask in writing whether it fills a vacant permanent post. A substitute post cannot be made permanent, so keep applying while you work.","Ask your principal what the school needs in three years, then go and get that qualification."]},{"id":"growing","label":"Keep studying and climbing","line":"You want the qualification after your name and the post that comes with it.","steps":["Finish your current qualification well. Postgraduate funding is decided on marks.","Apply for Honours funding a year before you need it. Most deadlines close eight to twelve months early.","Get onto a marking panel. Marking leads to senior marker, then examiner, then moderator. That is the assessment ladder into department work."]},{"id":"moving","label":"Move around, try things","line":"You do not want to sit in one staffroom for thirty years. Good, because this profession lets you move.","steps":["Watch the Needed now board and keep your documents in one folder on your phone. These posts are gone in a day.","Register on several provincial databases at once, not just your own.","Get your documents ready for abroad early: SACE certificate, police clearance, certified copies. Doors open at short notice."]},{"id":"open","label":"Show me everything","line":"You are keeping your options open. Fair enough. Here is the whole board.","steps":["Start with your province's database. It costs nothing and opens the most doors.","Read the How to apply guides once, properly. Most applications are rejected on paperwork, not on merit.","Pick one thing to apply for this week. One real application beats ten saved links."]}],"GUIDES":[{"t":"Answer an urgent WhatsApp post without losing the job","steps":["Have one folder on your phone, ready before you need it: ID, SACE certificate or proof of application, qualification, academic record, one-page CV as a PDF, and three referees with numbers.","Phone the number. Do not WhatsApp and do not email. These posts are filled by whoever calls first and sounds ready.","Say four things in the first fifteen seconds: your name, your subject and phase, your SACE status, and when you can start.","Ask two questions: is it temporary or permanent, and who do I report to on the first day.","Send your documents in one message immediately after the call, as a single PDF where possible.","Follow up once the next morning if you have not heard. Once, not three times."],"warn":"Check the post is real before you travel. Search the school name, phone the school's own landline, and never pay anyone a cent to be considered. No legitimate South African school charges a teacher to apply."},{"t":"Tell the three kinds of school post apart before you apply","steps":["Read the advert for the words departmental, SGB, SBL, governing body, or substitute. That one word changes everything about the job.","A DEPARTMENTAL post is paid by the province on state salary scales, with state benefits, pension and job security. These are advertised in the provincial vacancy bulletin and go through the full formal process.","An SGB or SBL post is paid by the school itself out of school fees. The school governing body decides the salary and the conditions, so both vary enormously. Some pay better than the state, many pay less, and the security is weaker.","A SUBSTITUTE or relief post covers someone who is away. It is short, it is filled fast, and it is the most common way new teachers get their first paid classroom time.","For an SGB post, ask three questions before you accept: what is the monthly salary, is there a pension or medical contribution, and what happens to the post if the school fee income drops.","For a departmental post, expect two to three months from advert to appointment. Do not stop applying elsewhere while you wait."],"warn":"An SGB post still counts as real teaching experience and still needs SACE registration. It is not a lesser job, it is a differently funded one. Just go in knowing which you are signing."},{"t":"Apply for a provincial teaching post online","steps":["Go to your province's education department site (see the Provinces tab) and find the vacancy list or bulletin.","Create a profile on the recruitment system. Use an email address you will still have in two years.","Load your personal details, qualifications and SACE number once. The system keeps them for future applications.","Upload certified copies of your ID, qualifications, academic record and SACE certificate. Scans must be clear and the right file type.","Find the post and note its reference number exactly. One wrong digit and your application is thrown out.","Complete every section. Blank fields are treated as incomplete applications.","Submit before the closing date. Late applications are never considered.","Save your confirmation and check the portal weekly. Expect two to three months from advert to appointment."],"warn":"Some provinces, such as the Western Cape, only accept online applications. Emailed, faxed and hand-delivered applications are thrown away without being read."},{"t":"Apply to mark the Grade 12 exams","steps":["From January, watch your provincial education department and its examinations directorate for the marker application notice. The window is usually four to six weeks around February and March.","Check you qualify: you normally must be currently teaching that subject, with recent Grade 12 experience in it.","Register on your province's online marker system. Some provinces still run a paper form through the district office as well. Do both if both are offered.","Complete a separate application for each subject and paper you want to mark.","Get your application verified by your principal or subject adviser where the form requires it. Unverified forms are rejected.","Attach certified copies of your qualifications.","Submit before the closing date, through the exact channel named. No faxes, no late forms, no exceptions.","If selected, expect a competency check and training before the session."],"warn":"You usually cannot apply if you are a principal, if you are the subject adviser for that subject, if you will be on leave during the session, or if you have a child writing that subject that year. Declare it. Being caught hiding it disqualifies you permanently."},{"t":"Fill in the Z83 form for a department or office post","steps":["Download the current Z83 from the DPSA site or the advertising department. Old versions are rejected.","Read the advert twice and write down the reference number, the closing date and the exact submission method.","Complete every section in full. Do not write 'see CV', because that alone disqualifies you.","Sign and date it. An unsigned Z83 is invalid.","Attach a detailed CV. Only attach certified qualification copies if the advert asks at this stage. Many now only ask shortlisted candidates.","Submit exactly as instructed: portal, email, post or hand delivery. Mixing methods disqualifies you.","Keep a dated copy of everything you sent."],"warn":"For senior management posts you also need a Nyukela pre-entry certificate from the National School of Government before you can be appointed."},{"t":"Get onto a school's substitute list","steps":["List ten schools you could reach easily and would be happy to work at.","Prepare a one-page CV, proof of SACE registration or application, and your ID.","Phone each school and ask for the principal or the deputy who handles staffing. Ask one question: do you keep a list of relief teachers?","Deliver your documents in person where you can. Being a face and not an email is the whole point.","Follow up once a term, briefly. Availability changes constantly.","Say yes to short work. A three-day booking is how most permanent posts start."],"warn":""},{"t":"Apply for the Funza Lushaka bursary","steps":["Check you qualify: South African citizen, accepted or applying for a BEd or PGCE at a public university, specialising in priority subjects.","Get documents ready first: ID, latest results, proof of university application or registration, household income proof.","Register on the e-Gov portal at eservices.gov.za and verify your account.","Complete the application, choosing your qualification and priority subjects carefully.","Upload clear, certified scans. Blurry documents are the commonest reason for rejection.","Submit and record your reference number.","Check your status on the portal, and watch your email and phone. Offers sometimes carry a short deadline to accept."],"warn":"The bursary carries a service obligation: you teach at a public school for the same number of years it funded you, wherever the department places you. Read that before you accept."},{"t":"Apply for postgraduate funding","steps":["Work backwards from when you want to start. Most funders close eight to twelve months before the course begins.","Get your university acceptance, or at least a supervisor's letter of support, as early as you can.","Write a clear research proposal: the problem, why it matters in South African schools, how you will study it, what will change because of it.","Ask two referees early and give them your CV, your proposal and the deadline.","Apply to more than one funder in the same season. Applying to only one is the commonest mistake.","Keep every reference number and confirmation email in one folder."],"warn":""},{"t":"Build a teacher CV that actually gets read","steps":["Two pages. Panels read dozens in one sitting.","Top of page one: name, phone, email, SACE number, the phases you teach and your teaching subjects.","Qualifications with institution and year, most recent first.","For each teaching experience, give the school, the grades, the subjects and the class sizes. Numbers convince more than adjectives.","One short section on results: what you improved, and by how much.","List marking, moderation, extra-murals and committees. Schools hire people who will run the debating team.","Three referees with positions and current phone numbers, and ask them first.","Save as PDF, named with your own name, not 'CV final final'."],"warn":""},{"t":"Prepare documents for working abroad","steps":["Order your SACE certificate and confirm your registration is paid up.","Apply for a police clearance certificate through SAPS, and allow six to eight weeks.","Get certified copies of your degree, transcript and ID.","Have your qualifications authenticated or apostilled through DIRCO. Ask the destination country which one they need, because it differs.","Get a medical certificate if the country requires one.","Scan everything at high quality into one cloud folder you can send from your phone.","Only then start applying. Employers move fast and the person with ready documents wins."],"warn":"Never hand original documents to a recruiter, and never pay a placement fee before you have a signed contract."}],"ROUTE_BECOME":[{"h":"Pass matric with the right subjects","p":"You need a National Senior Certificate with a bachelor's pass for a BEd. To teach Mathematics or Physical Sciences you must have passed those yourself, usually at 50% or higher. If you did Mathematical Literacy you can still teach many other subjects: languages, Life Orientation, History, Business Studies, Accounting and more."},{"h":"Choose your route","p":"Two roads. <strong>Road one:</strong> a four-year Bachelor of Education straight after matric. <strong>Road two:</strong> any three-year degree first, then a one-year Postgraduate Certificate in Education. Both end in the same place. Road two suits you if you already have a degree or are not sure yet."},{"h":"Choose your phase and your subjects","p":"Foundation Phase is Grade R to 3, Intermediate is 4 to 6, Senior is 7 to 9, FET is 10 to 12. You usually pick two teaching subjects. Choose at least one scarce subject: Mathematics, Physical Sciences, Accounting, Technology or an African language, because that is what gets you hired first, and what gets you onto marking panels later."},{"h":"Apply to a university and apply for money at the same time","p":"University applications generally open in April and close between June and September for the following year. Do not wait for your acceptance letter before applying for funding. Apply for Funza Lushaka and NSFAS in the same season."},{"h":"Do your teaching practice properly","p":"Every education qualification includes weeks of supervised teaching in real schools. Treat it as a long job interview. Many first posts come from the practical school. Keep every lesson plan, assessment and signed evaluation form. That becomes your portfolio of evidence."},{"h":"Register with SACE","p":"You cannot be legally employed as a teacher without it. Apply for provisional registration while you are still a student so you can take paid relief work, then convert to full registration when you graduate."},{"h":"Get onto the databases, then work the phone","p":"Register on your provincial database and on any other province you would move to. Apply for advertised posts, check the DPSA circular for office posts, and phone schools directly about relief. The fastest jobs in this country are never advertised."}],"ROUTE_MARK":[{"h":"Teach the subject at the right grade first","p":"Almost every marking post requires you to be currently teaching that exact subject, and most provinces want Grade 12 experience in it. If you are not there yet, start with the support roles below: marking assistant, script capturer and invigilator, which do not have that requirement."},{"h":"Apply as a marker early in the year","p":"This catches people out. The exams are in November, but the applications open in February and March, months before. Watch your provincial exams directorate from January. Miss the window and you wait a full year."},{"h":"Do one session well, then move up","p":"The ladder is marker, senior marker, deputy chief marker, chief marker, internal moderator. Each step is decided on your record from the last session, so reliability and accuracy matter more than seniority at your school."},{"h":"Move into setting papers","p":"Once you have marking experience, the DBE recruits examiners and internal moderators to set the national question papers, finalise marking guidelines and train chief markers. This is where teaching turns into national assessment work."},{"h":"Then Umalusi, or the department","p":"With roughly five years of national marking behind you and a subject qualification at third-year or honours level, you can apply as an Umalusi external moderator. From there the doors are curriculum, examinations, quality assurance and district office work."}],"ROUTE_STUDY":[{"h":"Honours or a Postgraduate Diploma","p":"One year full time, two part time. This is the gate to everything after it. Education Honours specialisations include curriculum studies, educational psychology, education management, inclusive education and subject didactics. Apply about a year ahead, and apply for funding at the same time."},{"h":"Master's","p":"One to two years. Either coursework with a mini-dissertation, or full research. Many teachers do this part time while teaching. A master's is the usual minimum for lecturing, for senior department posts, and for curriculum and assessment work."},{"h":"PhD","p":"Three years or more of original research. Many funded doctoral students pay no fees, and universities want more education doctorates than they can find. This is the door to full academic posts."},{"h":"Postdoctoral fellowship","p":"After the PhD, a one to three year paid research position. South African postdocs are often tax-free, and there are fellowships across Africa, Europe, North America and Asia."},{"h":"Study abroad at any of these stages","p":"You do not have to do all your degrees in one country. Chevening, DAAD, Erasmus Mundus, Fulbright, Commonwealth, Mandela Rhodes and Canon Collins all fund Southern Africans. Deadlines fall eight to fourteen months before the course starts, so work backwards from the date you want to begin."}],"ROUTE_ABROAD":[{"h":"Get your SACE certificate and keep it current","p":"Almost every foreign employer and immigration department asks for proof that you are a registered teacher at home. Order a printed certificate and keep a good scan."},{"h":"Get a police clearance certificate","p":"Apply through the South African Police Service. It takes several weeks. Most countries will not process a work visa without one issued in the last six months."},{"h":"Get your qualifications verified and legalised","p":"Usually certified copies, then authentication or an apostille through the Department of International Relations and Cooperation, and sometimes an evaluation by the receiving country. Start before you apply, not after you are offered a job."},{"h":"Decide which market fits you","p":"The Gulf states and East Asia pay well and often include housing and flights, but contracts are strict. The United Kingdom needs Mathematics, Sciences and languages and has a clear visa route. International schools across Africa pay less but are closer to home. Read the contract, not the brochure."},{"h":"Apply directly where you can","p":"Many international schools advertise on their own websites and hire directly. Where you use a recruiter, check the employer pays them, not you. Ask to speak to a South African teacher already at the school before you sign."},{"h":"Plan your return","p":"If you want to come back into a South African public school later, stay on your provincial database and keep your SACE registration paid while you are away."}],"PROVINCE_LINKS":[{"name":"Eastern Cape Department of Education","note":"Vacancies and circulars","url":"https://www.ecdoe.gov.za"},{"name":"Free State Department of Education","note":"Vacancy bulletins (PDF)","url":"https://www.education.fs.gov.za/?page_id=1283"},{"name":"Gauteng Department of Education","note":"Vacancies page","url":"https://education.gauteng.gov.za/pages/vacancies.aspx"},{"name":"Gauteng: Unemployed Educators database","note":"Register here if you want a post in Gauteng","url":"https://unemployededucators.gauteng.gov.za/Vacancy/Vacancy.aspx"},{"name":"KwaZulu-Natal Department of Education","note":"Recruitment and vacancies","url":"https://www.kzneducation.gov.za/index.php/recruitment/vacancies"},{"name":"Limpopo Department of Education","note":"Career opportunities","url":"https://www.edu.limpopo.gov.za"},{"name":"Mpumalanga Department of Education","note":"Vacancies","url":"https://mpeducation.mpg.gov.za/vacancies.htm"},{"name":"Northern Cape Department of Education","note":"Vacancies and circulars","url":"https://www.ncdoe.gov.za"},{"name":"North West Department of Education","note":"Careers, plus the Z83 and EDNW forms","url":"https://education.nwpg.gov.za/?page_id=13"},{"name":"Western Cape Education Department","note":"Vacancies and bulletins","url":"https://www.westerncape.gov.za/education/vacancies"},{"name":"Western Cape e-Recruitment","note":"All WCED applications go through here. Email and hand delivery are not accepted","url":"https://e-recruitment.westerncape.gov.za/"},{"name":"Department of Basic Education","note":"National vacancies and links to all nine provincial departments","url":"https://www.education.gov.za/Vacancies.aspx"}],"KINDS":[{"id":"teach","label":"Teaching posts","cls":"t-teach"},{"id":"db","label":"Databases to join","cls":"t-db"},{"id":"start","label":"Tutoring, assisting, internships","cls":"t-start"},{"id":"mark","label":"Marking & assessment","cls":"t-mark"},{"id":"dept","label":"Department & office posts","cls":"t-db"},{"id":"money","label":"Bursaries & funding","cls":"t-money"},{"id":"study","label":"Postgraduate study","cls":"t-study"},{"id":"work","label":"Outside South Africa","cls":"t-work"},{"id":"coach","label":"Sport and culture coaching","cls":"t-start"},{"id":"support","label":"School support jobs","cls":"t-work"}],"SPEEDS":[{"id":"now","label":"Needed now, phone today"},{"id":"days","label":"Closes within days"},{"id":"formal","label":"Formal process, 2 to 3 months"},{"id":"always","label":"Open all year"},{"id":"season","label":"Opens in a season each year"}],"PROVINCES":[{"id":"nat","label":"National / all provinces"},{"id":"ec","label":"Eastern Cape"},{"id":"fs","label":"Free State"},{"id":"gp","label":"Gauteng"},{"id":"kzn","label":"KwaZulu-Natal"},{"id":"lp","label":"Limpopo"},{"id":"mp","label":"Mpumalanga"},{"id":"nc","label":"Northern Cape"},{"id":"nw","label":"North West"},{"id":"wc","label":"Western Cape"},{"id":"unk","label":"Province not stated"},{"id":"int","label":"International"}]},"pay":{"title":"Pay, benefits and your first post","intro":"What a public school teacher earns in 2026/27, what you get on top of your salary, what to do once you get a post, and how to choose between a substitute post near home and a permanent post far away. Checked against government sources in October 2026.","updated":"2026-10-12","sections":[{"h":"What a new teacher earns","p":["Your salary depends on your post level (your rank: Post Level 1 is a classroom teacher) and your REQV (a rating of your qualification). A four-year BEd, or a degree plus a PGCE, is REQV 14.","From 1 April 2026 a new Post Level 1 teacher with REQV 14 earns R366,051 a year, which is R30,504 a month before deductions. This comes from the official salary notice in Government Gazette 54758 of 29 May 2026."],"table":{"head":["Qualification","REQV","Per year","Per month"],"rows":[["3-year diploma","13","R281,319","R23,443"],["4-year BEd, or degree plus PGCE","14","R366,051","R30,504"],["Honours","15","R366,051, plus a once-off R36,605 after one year","R30,504"],["Master's","16","R366,051, plus a once-off R73,210 after one year","R30,504"]]},"b":["An Honours or Master's does not give you a higher starting salary. After one year of service you get a once-off cash bonus instead.","You will often see older figures online, like R262,000 or R284,238 a year. Those are from 2018 and 2019. Trust the gazette.","Salaries go up every 1 April. Under the current wage agreement the increase is between 4% and 6%. The April 2027 figure will be set in the February 2027 Budget."]},{"h":"Is pay the same in every province?","p":["Yes. Basic salaries are set nationally and every province pays from the same scale through PERSAL (the government payroll system)."],"b":["What can differ is extra allowances. Some provinces have paid a rural or remote school allowance, but amounts and rules change with each province's budget. Limpopo stopped its rural allowance in 2022. Ask the district office before you count on one.","Each province has its own vacancy bulletins, database and hiring timelines."]},{"h":"What lands in your account","p":["An estimate for a new single teacher on REQV 14, renting, on the cheapest GEMS medical aid option. Your real payslip will differ."],"table":{"head":["Item","Per month"],"rows":[["Salary before deductions","R30,504"],["Pension (GEPF, you pay 7.5%)","minus R2,288"],["Income tax (estimate)","minus R4,365"],["Medical aid (your share after the state subsidy)","minus R807"],["Union fee (about 1%)","minus R305"],["SACE fee","minus R17"],["Take-home (estimate)","about R22,700"]]},"b":["On top of this the state puts 13% of your salary (about R3,966) into your pension every month.","State-paid teachers do not pay UIF. Teachers paid by a school governing body (SGB) do."]},{"h":"Your benefits","b":["Pension (GEPF): you pay 7.5% and the state pays 13%. If you resign, you can transfer your money to another retirement fund. Taking it in cash is taxed and costs you years of savings.","Medical aid subsidy: the state pays 75% of your GEMS contribution, up to R2,014 a month for a single member from 1 April 2026. You only get it if you join GEMS.","Housing allowance: R1,973 a month from 1 July 2025, adjusted every July. If you own your home it is paid to you. If you rent, it is saved for you in a housing savings account (the ILSF) until you buy a home. If you resign before you buy, you lose those savings.","13th cheque: a service bonus paid every year in your birth month. In your first year you get a part of it, counted from the day you started.","Pay progression: about 1.5% extra a year, paid on 1 July, if your performance evaluation (QMS) is satisfactory.","Leave: school holidays are your annual leave. You get 36 days of sick leave over three years, four months of paid maternity leave, and family responsibility leave."]},{"h":"Which posts get these benefits","table":{"head":["Post type","Pension, medical aid, housing, 13th cheque"],"rows":[["Permanent","Yes"],["Temporary, against a vacant post, 6 months or longer","Yes"],["Substitute (replacing a teacher on leave)","Usually not"],["SGB post (paid by the school)","No, unless the school's contract says so"]]}},{"h":"Once you get the post, step by step","steps":["Read your appointment letter. Check the post level, REQV, start date and whether it is permanent, temporary or substitute.","Sign the assumption of duty form on your first day. This starts your pay.","Give HR your documents for PERSAL: certified ID, qualifications and academic record, SACE certificate, a bank confirmation letter, your tax number and the signed forms.","Plan for a late first salary. It often arrives a month or more late and is then paid as back pay.","Join GEMS so the medical aid subsidy starts.","Apply for the housing allowance with proof that you own or rent.","Name the people who should get your pension if something happens to you (GEPF beneficiaries).","Join a union if you want to. The fee comes off your salary.","Upgrade to full SACE registration if you have not. You cannot be made permanent without it.","Your first 12 months are probation. Ask your principal to confirm in writing when it ends.","Take part in QMS (your performance evaluation). Your yearly increase depends on it."]},{"h":"Substitute post near home, or permanent post far away?","p":["A substitute post cannot be changed into a permanent post. You would still have to apply for an advertised vacancy and compete for it. A temporary post that fills a funded vacant post can sometimes be made permanent, but teachers who already have a permanent post and lost it at their school (excess educators) are placed first.","If you take a permanent post, you can apply for a transfer later. The new school needs a vacant post, both principals sign, and it usually takes up to three months. Never resign to move."],"table":{"head":["Take the permanent post if","Think about the substitute or temporary post if"],"rows":[["You have no other income, or you have debts or people who depend on you","It fills a funded vacant permanent post, and you get that in writing"],["You want a pension, medical aid and housing savings now","You have savings to cover the months between contracts"],["The area is safe enough and you can find a place to stay","The school and district say no excess educator is waiting for it"],["You can stay one or two years, then apply to move","Family or health reasons make moving impossible"]]},"b":["For most new teachers, permanent first is the stronger choice. Before you accept a far-away post, visit the area, check where you will live and ask whether any rural allowance is actually being paid."]},{"h":"Tips for new teachers, in order","steps":["Register on the DBE National Recruitment Database and on every provincial database where you would work. It is free.","Keep your SACE registration active, and keep recently certified copies of your ID, qualifications and SACE certificate, plus a filled-in Z83 and an up-to-date CV, ready on your phone.","Read each vacancy bulletin closely and apply exactly the way it asks.","Walk into schools near you with your CV and SACE certificate. Principals hear about substitute posts first.","Nobody official ever charges money for a post. Report anyone who asks.","In your first year, save one to three months of expenses, avoid store cards and loans, and let your housing savings grow.","Grow your career with marking, an Honours degree and, after a few years, a Departmental Head post."]}],"sources":[["Teacher salaries 2026, Government Gazette 54758","https://businesstech.co.za/news/wp-content/uploads/2026/06/Teacher-salaries-2026.pdf"],["DPSA: 4% wage increase for 2026","https://www.dpsa.gov.za/thepublicservant/2026/04/24/minister-buthelezi-announces-4-wage-increase-for-public-servants/"],["DPSA: medical assistance rules for 2026","https://www.dpsa.gov.za/dpsa2g/documents/cos/2025/17_12_P_12_12_2025_A%20REVISED%20DETERMINATION%20AND%20DIRECTIVE%20ON%20MEDICAL%20ASSISTANCE%20FOR%20EMPLOYEES%20IN%20THE%20PUBLIC%20SERVICE%20-%202026.pdf"],["GEPF membership guide","https://gepf.co.za/wp-content/uploads/2024/12/GEPF-Membership-Guide.pdf"],["ELRC agreement on converting temporary educators (2024)","https://elrc.org.za/docs/no-2-of-2024-the-appointment-and-conversion-of-temporary-educators/"],["Western Cape circular 0027/2026 on contract posts","https://www.westerncape.gov.za/education/files/wcg-blob-files?file=2026-08%2FCircular+0027-2026.pdf&type=file"],["SACE registration requirements","https://www.sace.org.za/pages/registration-criteria-and-procedures"]]},"stories":[]}</script>

const KIND_SHORT = {teach:"Teaching post", start:"Assistant or student post", mark:"Marking and exams", coach:"Coaching", support:"School support job", dept:"Department or office post", money:"Bursary or funding", study:"Study further", work:"Outside South Africa", db:"Database to join"};

const live = POSTS.filter(isLive);
const byId = Object.fromEntries(POSTS.map(p => [p.id, p]));
const placeOf = p => [p.town, PROV[p.prov] && !["nat","unk","int"].includes(p.prov) ? PROV[p.prov].label : (p.prov === "int" ? "" : "")].filter(Boolean).join(", ");
const orgLine = p => { const o = p.org || "", pl = placeOf(p); if(!pl) return o; const parts = pl.split(", ").filter(x => !norm(o).includes(norm(x))); return [o, ...parts].filter(Boolean).join(", "); };

function dueOf(p){
  if(p.speed === "now" && !p.closes) return {txt:"Phone today", hot:true};
  if(p.closes){
    const d = daysLeft(p.closes);
    if(d < 0) return {txt:"Closed", closed:true};
    if(d === 0) return {txt:"Closes today", hot:true};
    if(d === 1) return {txt:"Closes tomorrow", hot:true};
    return {txt: d + " days left", hot: d <= 3};
  }
  if(p.speed === "always") return {txt:"Open all year"};
  if(p.speed === "season") return {txt:"Opens each year"};
  return {txt: p.start ? "Starts " + p.start : "No closing date"};
}
function dateBlock(p){
  const due = dueOf(p);
  if(p.closes && !due.closed){ const d = dOf(p.closes); return `<div class="date${due.hot ? " hot" : ""}"><b>${d.getDate()}</b><i>${MON[d.getMonth()]}</i></div>`; }
  if(p.speed === "now") return `<div class="date hot">${I("bolt")}</div>`;
  const ic = {money:"coins", study:"grad", db:"db", work:"globe", mark:"pen", dept:"doc"}[p.kind] || "pin";
  return `<div class="date gen">${I(ic)}</div>`;
}

const toggleSave = id => { saved.has(id) ? saved.delete(id) : saved.add(id); store.set("kena.saved", [...saved]); toast(saved.has(id) ? "Saved" : "Removed from saved"); };
const heart = p => `<button class="heart${saved.has(p.id) ? " on" : ""}" data-save="${p.id}" aria-label="${saved.has(p.id) ? "Remove from saved" : "Save this post"}">${I("heart")}</button>`;
function rowHTML(p){
  const due = dueOf(p);
  return `<li><div class="row"><a class="row" style="padding:0;color:inherit;text-decoration:none" href="#/post/${p.id}">${dateBlock(p)}<div class="tx"><h4>${esc(p.title)}</h4><p>${esc(orgLine(p))}</p><span class="due${due.hot ? " hot" : ""}${due.closed ? " closed" : ""}">${esc(due.txt)}</span></div></a>${heart(p)}</div></li>`;
}
const rowsHTML = list => `<ul class="rows">${list.map(rowHTML).join("")}</ul>`;

/* ---------- prefs ---------- */
let prefs = store.get("kena.prefs", {stage:"", path:"open", subjects:[], provs:[]});
const savePrefs = () => store.set("kena.prefs", prefs);
const matchesPrefs = p => {
  if(prefs.stage && p.stages && p.stages.length && !p.stages.includes(prefs.stage)) return false;
  if(prefs.provs.length && !prefs.provs.includes(p.prov) && p.prov !== "nat") return false;
  if(prefs.subjects.length && p.subjects && p.subjects.length && !p.subjects.some(s => prefs.subjects.includes(s))) return false;
  if(prefs.subjects.length && (!p.subjects || !p.subjects.length) && p.kind === "teach") return false;
  return true;
};
const hasPrefs = () => prefs.stage || prefs.subjects.length || prefs.provs.length;

/* ---------- sorting helpers ---------- */
const byClosing = (a, b) => (a.closes || "9999").localeCompare(b.closes || "9999");
const jobKinds = new Set(["teach","start","mark","coach","support","dept"]);
const urgent = () => live.filter(p => p.speed === "now").sort(byClosing);
const closingSoon = () => live.filter(p => p.closes && daysLeft(p.closes) >= 0 && daysLeft(p.closes) <= 14).sort(byClosing);
const latestSeen = POSTS.reduce((m, p) => p.seen > m ? p.seen : m, "");
const newest = () => live.filter(p => p.seen === latestSeen && jobKinds.has(p.kind));

const TABS = [["home","Home","#/"],["search","Search","#/search"],["map","Map","#/map"],["heart","Saved","#/saved"],["book","Guides","#/guides"]];

}

/* ---------- search ---------- */
let F = {q:"", kind:"", subject:"", prov:"", town:"", phase:"", ptype:"", closing:""};
const FILTERS = [
  ["kind","Type", () => C.KINDS.filter(k => live.some(p => p.kind === k.id)).map(k => [k.id, KIND_SHORT[k.id] || k.label])],
  ["subject","Subject", () => [...new Set(live.flatMap(p => p.subjects || []))].sort().map(s => [s, s])],
  ["prov","Province", () => C.PROVINCES.filter(p => live.some(x => x.prov === p.id)).map(p => [p.id, p.label])],
  ["town","Town", () => [...new Set(live.filter(p => !F.prov || p.prov === F.prov).map(p => p.town).filter(Boolean))].sort().map(t => [t, t])],
  ["phase","Phase", () => PHASES.filter(ph => live.some(p => (p.phases || []).includes(ph))).map(ph => [ph, ph === "FET" ? "FET (Grades 10 to 12)" : ph])],
  ["ptype","Post type", () => [...new Set(live.map(p => p.ptype).filter(Boolean))].sort().map(t => [t, t])],
  ["closing","Closing", () => [["7","Closes within 7 days"],["14","Closes within 14 days"],["30","Closes within a month"],["none","No closing date"]]]
];
const hay = p => norm([p.title, p.org, p.town, PROV[p.prov]?.label, p.what, p.who, (p.subjects || []).join(" "), (p.phases || []).join(" "), p.ptype, p.grades, KIND_SHORT[p.kind], p.lang].join(" "));
POSTS.forEach(p => p._h = hay(p));
const SYN = {maths:"mathematics", math:"mathematics", wiskunde:"mathematics", "maths lit":"mathematical literacy", bursary:"bursary funding", pta:"pretoria", jhb:"johannesburg", cpt:"cape town", dbn:"durban", pe:"gqeberha", kzn:"kwazulu-natal", gp:"gauteng", wc:"western cape", ec:"eastern cape", nw:"north west", fs:"free state", lp:"limpopo", mp:"mpumalanga", nc:"northern cape", it:"information technology", lo:"life orientation", "grade r":"grade r", afr:"afrikaans", eng:"english"};
function terms(q){ let n = norm(q).trim(); Object.entries(SYN).forEach(([a, b]) => { if(n === a) n = b; }); return n.split(/\s+/).filter(Boolean).map(t => SYN[t] ? norm(SYN[t]).split(" ")[0] : t); }
function filterPosts(){
  const t = terms(F.q);
  return live.filter(p => {
    if(F.kind && p.kind !== F.kind) return false;
    if(F.subject && !(p.subjects || []).includes(F.subject)) return false;
    if(F.prov && p.prov !== F.prov && !(p.prov === "nat" && F.kind !== "teach")) return false;
    if(F.town && p.town !== F.town) return false;
    if(F.phase && !(p.phases || []).includes(F.phase)) return false;
    if(F.ptype && p.ptype !== F.ptype) return false;
    if(F.closing){ if(F.closing === "none"){ if(p.closes) return false; } else { if(!p.closes) return false; const d = daysLeft(p.closes); if(d < 0 || d > +F.closing) return false; } }
    if(t.length && !t.every(w => p._h.includes(w))) return false;
    return true;
  });
}
const GUIDE_INDEX = [
  ...C.GUIDES.map((g, i) => ({t:g.t, h:"#/howto/" + i, txt:norm(g.t + " " + g.steps.join(" "))})),
  {t:PAY.title, h:"#/pay", txt:norm(PAY.title + " salary pay benefits housing medical pension gems gepf substitute permanent transfer notch reqv " + PAY.sections.map(s => s.h + " " + (s.p || []).join(" ") + " " + (s.b || []).join(" ")).join(" "))},
  ...C.PROVINCE_LINKS.map(l => ({t:l.name, h:l.url, ext:true, txt:norm(l.name + " " + l.note + " database vacancies")})),
  {t:"How to become a teacher", h:"#/route/become", txt:norm("become teacher bed pgce matric " + C.ROUTE_BECOME.map(r => r.h + " " + r.p).join(" "))},
  {t:"Marking and assessment, step by step", h:"#/route/mark", txt:norm("marking marker moderator examiner " + C.ROUTE_MARK.map(r => r.h + " " + r.p).join(" "))},
  {t:"Study further", h:"#/route/study", txt:norm("study honours masters phd " + C.ROUTE_STUDY.map(r => r.h + " " + r.p).join(" "))},
  {t:"Teaching outside South Africa", h:"#/route/abroad", txt:norm("abroad overseas international " + C.ROUTE_ABROAD.map(r => r.h + " " + r.p).join(" "))}
];
function viewSearch(preset){
  drawNav("Search");
  if(preset){
    F = {q:"", kind:"", subject:"", prov:"", town:"", phase:"", ptype:"", closing:""};
    if(preset === "closing") F.closing = "14";
    else if(preset === "money") F.kind = "money";
    else if(["teach","mark","coach","support","start","study","dept","work","db"].includes(preset)) F.kind = preset;
  }
  const special = ["now","new","foryou"].includes(preset) ? preset : "";
  app.innerHTML = `<div class="bar"><div class="wrap">
      <label class="searchbox">${I("search")}<span class="sr">Search</span><input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Subject, school, town or bursary" value="${esc(F.q)}"></label>
      <div class="chips" id="chips"></div></div></div>
    <main class="wrap" id="results"></main>`;
  const q = $("#q");
  q.addEventListener("input", () => { F.q = q.value; drawResults(special); });
  if(!preset && !F.q) setTimeout(() => q.focus(), 60);
  drawResults(special);
}
function drawChips(){
  $("#chips").innerHTML = FILTERS.map(([k, label, opts]) => {
    const v = F[k];
    if(!v) return `<button class="chip" data-filter="${k}">${label}</button>`;
    const name = (opts().find(o => o[0] === v) || [v, v])[1];
    return `<button class="chip on" data-filter="${k}">${esc(name)} <span class="x" data-clear="${k}" aria-label="Clear ${label}">×</span></button>`;
  }).join("");
}
function drawResults(special){
  drawChips();
  let list = filterPosts();
  let title = "";
  if(special === "now"){ list = list.filter(p => p.speed === "now"); title = "Needed now"; }
  if(special === "new"){ list = list.filter(p => p.seen === latestSeen); title = "New on " + fmt(latestSeen); }
  if(special === "foryou"){ list = list.filter(matchesPrefs).filter(p => jobKinds.has(p.kind)); title = "For you"; }
  list.sort((a, b) => { const ac = a.closes && daysLeft(a.closes) >= 0, bc = b.closes && daysLeft(b.closes) >= 0; if(ac && bc) return byClosing(a, b); if(ac !== bc) return ac ? -1 : 1; return (b.seen || "").localeCompare(a.seen || ""); });
  const t = terms(F.q);
  const guides = t.length ? GUIDE_INDEX.filter(g => t.every(w => g.txt.includes(w))).slice(0, 4) : [];
  const anyFilter = Object.entries(F).some(([k, v]) => k !== "q" && v);
  $("#results").innerHTML = `
    <div class="sec"><h3>${esc(title || (F.q || anyFilter ? "Results" : "Everything open"))}</h3><span class="sub">${list.length} ${list.length === 1 ? "post" : "posts"}</span></div>
    ${list.length ? rowsHTML(list.slice(0, 60)) : `<div class="empty"><h4>No posts match</h4>Try fewer words, or clear a filter. New posts arrive every few days.</div>`}
    ${list.length > 60 ? `<button class="more" id="showall">Show all ${list.length}</button>` : ""}
    ${guides.length ? `<div class="sec"><h3>Guides</h3></div><div class="glist">${guides.map(g => `<a href="${g.h}" ${g.ext ? 'target="_blank" rel="noopener"' : ""}><span class="gi">${I(g.ext ? "db" : "book")}</span><div><h4>${esc(g.t)}</h4></div></a>`).join("")}</div>` : ""}`;
  const sa = $("#showall"); if(sa) sa.onclick = () => { sa.outerHTML = rowsHTML(list.slice(60)); };
}
document.addEventListener("click", e => {
  const clr = e.target.closest("[data-clear]");
  if(clr){ e.stopPropagation(); F[clr.dataset.clear] = ""; if(clr.dataset.clear === "prov") F.town = ""; drawResults(""); return; }
  const f = e.target.closest("[data-filter]");
  if(f){
    const [k, label, opts] = FILTERS.find(x => x[0] === f.dataset.filter);
    const counts = o => filterPostsWith(k, o).length;
    openSheet(`<h3>${label}</h3><div class="opts">${[["", "Any"], ...opts()].map(([v, n]) => `<button class="opt${F[k] === v ? " on" : ""}" data-set="${k}" data-v="${esc(v)}">${esc(n)}${v ? `<span>${counts(v)}</span>` : ""}</button>`).join("")}</div>`);
  }
  const s = e.target.closest("[data-set]");
  if(s){ F[s.dataset.set] = s.dataset.v; if(s.dataset.set === "prov") F.town = ""; closeSheet(); drawResults(""); }
});
function filterPostsWith(k, v){ const old = F[k]; F[k] = v; const r = filterPosts(); F[k] = old; return r; }

/* ---------- post detail ---------- */
function viewPost(id){
  drawNav("");
  const p = byId[id];
  if(!p){ app.innerHTML = bar("Post") + `<main class="wrap"><div class="empty"><h4>This post is no longer on Kena</h4>It has closed or been taken down. <a href="#/search">See what is open</a>.</div></main>`; return; }
  const due = dueOf(p), closed = !isLive(p) || due.closed;
  const tags = [`<span class="tag">${esc(KIND_SHORT[p.kind] || "")}</span>`];
  if(p.ptype) tags.push(`<span class="tag">${esc(p.ptype)}</span>`);
  if(p.salary) tags.push(`<span class="tag gold">${esc(p.salary)}</span>`);
  (p.subjects || []).slice(0, 4).forEach(s => tags.push(`<span class="tag">${esc(s)}</span>`));
  const cnt = closed ? `<div class="count"><b>Closed</b>This post has closed. It stays here so links still work.</div>`
    : p.closes ? `<div class="count${due.hot ? " hot" : ""}"><b>${daysLeft(p.closes) <= 0 ? "Today" : daysLeft(p.closes)}</b>${daysLeft(p.closes) <= 0 ? "Last day to apply" : (daysLeft(p.closes) === 1 ? "day left" : "days left") + ", closes " + fmt(p.closes)}${p.closeTime ? " at " + esc(p.closeTime) : ""}</div>`
    : p.speed === "now" ? `<div class="count hot"><b>${I("bolt")}</b>Needed now. Phone the school today.</div>` : "";
  const cl = [];
  (p.phones || []).forEach(n => cl.push(`<div class="cline">${I("phone")}<a href="tel:${esc(n.replace(/\s/g, ""))}">${esc(n)}</a><button class="copy" data-copy="${esc(n)}">Copy</button></div>`));

  if(p.url) cl.push(`<div class="cline">${I("link")}<a href="${esc(p.url)}" target="_blank" rel="noopener">${p.phones?.length || p.emails?.length ? "Open the advert" : "Open the official page"}</a></div>`);
  const shareText = `${p.title}, ${orgLine(p)}. ${due.closed ? "" : due.txt + ". "}On Kena: ${CFG.site}#/post/${p.id}`;
  app.innerHTML = bar("") + `<article class="detail wrap">
    <div class="tags">${tags.join("")}</div>
    <h1>${esc(p.title)}</h1>
    <p class="org">${esc(p.org)}${placeOf(p) ? "<br>" + esc(placeOf(p)) : ""}</p>
    ${cnt}
    ${p.what ? `<div class="blk"><h3>What it is</h3><p>${esc(p.what)}</p></div>` : ""}
    ${p.who ? `<div class="blk"><h3>Who can apply</h3><p>${esc(p.who)}</p></div>` : ""}
    ${p.grades || (p.phases || []).length ? `<div class="blk"><h3>Grades and phase</h3><p>${esc([p.grades, (p.phases || []).join(", ")].filter(Boolean).join(". "))}</p></div>` : ""}
    ${p.lang ? `<div class="blk"><h3>Language</h3><p>${esc(p.lang)}</p></div>` : ""}
    ${p.when ? `<div class="blk"><h3>Dates</h3><p>${esc(p.when)}</p></div>` : ""}
    ${p.how || cl.length ? `<div class="blk"><h3>How to apply</h3>${p.how ? `<p>${esc(p.how)}</p>` : ""}<div class="contact">${cl.join("")}</div></div>` : ""}
    ${p.caution ? `<div class="warn">${esc(p.caution)}</div>` : ""}
    <div class="actions">
      <button class="btn${saved.has(p.id) ? " gold" : ""}" data-save="${p.id}" data-big>${I("heart")}<span>${saved.has(p.id) ? "Saved" : "Save"}</span></button>
      <a class="btn ghost" href="https://wa.me/?text=${encodeURIComponent(shareText)}" target="_blank" rel="noopener">${I("share")}Share</a>

  </article>`;
}

  drawNav("Saved");
  const list = [...saved].map(id => byId[id]).filter(Boolean);
  const open = list.filter(p => isLive(p) && !dueOf(p).closed).sort(byClosing), gone = list.filter(p => !isLive(p) || dueOf(p).closed);
  app.innerHTML = `<div class="bar"><div class="wrap"><div class="row"><h2 style="padding:8px 4px">Saved</h2></div></div></div><main class="wrap">
   ${list.length ? "" : `<div class="empty"><h4>Nothing saved yet</h4>Tap the heart on any post to keep it here. Saved posts stay on this phone.</div><a class="more" href="#/search">Browse open posts</a>`}
   ${open.length ? `<div class="sec"><h3>Still open</h3><span class="sub">${open.length}</span></div>${rowsHTML(open)}` : ""}

function tweenVB(a, b){
  const s = $("#zamap");
  if(!s || (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) return;
  const t0 = performance.now(), D = 420;
  s.setAttribute("viewBox", a.join(" "));
  const step = t => { if(!document.body.contains(s)) return; const k = Math.min(1, (t - t0) / D), e = 1 - Math.pow(1 - k, 3); s.setAttribute("viewBox", a.map((v, i) => (v + (b[i] - v) * e).toFixed(1)).join(" ")); if(k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function viewMap(){
  drawNav("Map");
  app.innerHTML = `<div class="mapwrap"><div class="mapstage">
    <div class="mapbar"><a class="brand" href="#/">${STAR}<span>Kena</span></a><button class="near" id="mapBack" hidden>${I("back")}All provinces</button><button class="near" id="nearBtn">${I("locate")}Near me</button></div>
    <div id="map"></div>
    <div class="maplegend" id="maplegend" aria-hidden="true"><span>Fewer posts</span>${["#E7D9F6","#CDB1EC","#A97DD8","#7F45B6","#4F237C"].map(c => `<i style="background:${c}"></i>`).join("")}<span>More</span></div>
   </div><section class="mapsheet" id="msheet" aria-live="polite"><div id="mbody"></div></section></div>`;
  curVB = null;
  drawMap(false);
  const pick = t => {
    const s = t.closest("[data-spot]"), p = t.closest("[data-prov]");
    if(s){ mapSpot = mapSpot === s.dataset.spot ? "" : s.dataset.spot; drawMap(false); }
    else if(p && !mapNear && mapSel !== p.dataset.prov){ mapSel = p.dataset.prov; mapSpot = ""; drawMap(true); }
  };
  $("#map").addEventListener("click", e => pick(e.target));
  $("#map").addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); pick(e.target); } });
  $("#mbody").addEventListener("click", e => {
    const b = e.target.closest("[data-mprov],[data-mspot],[data-km],[data-mback]"); if(!b) return;
    if(b.dataset.mback !== undefined){ mapSel = ""; mapSpot = ""; mapNear = false; drawMap(true); }
    else if(b.dataset.mprov){ mapSel = b.dataset.mprov; mapSpot = ""; mapNear = false; drawMap(true); }
    else if(b.dataset.mspot !== undefined){ mapSpot = b.dataset.mspot; drawMap(false); }
    else if(b.dataset.km){ near.km = +b.dataset.km; drawMap(true); }
  });
  $("#mapBack").onclick = () => { mapSel = ""; mapSpot = ""; mapNear = false; drawMap(true); };
  $("#nearBtn").onclick = () => {
    if(!navigator.geolocation){ toast("Location is not available on this device"); return; }
    $("#nearBtn").textContent = "Finding you";
    navigator.geolocation.getCurrentPosition(pos => { near.lat = pos.coords.latitude; near.lng = pos.coords.longitude; mapNear = true; mapSel = ""; mapSpot = ""; $("#nearBtn").innerHTML = I("locate") + "Near me"; drawMap(true); },
      () => { $("#nearBtn").innerHTML = I("locate") + "Near me"; toast("Kena could not get your location. You can still tap a province."); }, {timeout:12000, maximumAge:600000});
  };
}
function drawMap(anim){
  if(!$("#map")) return;
  const jobs = mapJobs();
  const box = $("#map").getBoundingClientRect();
  const m = mapSVG(jobs, {sel:mapSel, near:mapNear, w:Math.max(200, box.width), h:Math.max(160, box.height)});
  $("#map").innerHTML = m.html;
  $("#maplegend").hidden = !!(mapSel || mapNear);
  if(anim && curVB) tweenVB(curVB, m.vb);
  curVB = m.vb;
  $("#mapBack").hidden = !(mapSel || mapNear);
  $("#nearBtn").hidden = mapNear;
  drawMapSheet(jobs, m.spots);
}
function drawMapSheet(jobs, spots){
  const counts = provCounts(jobs), body = $("#mbody");
  const chip = (attr, label, n, on) => `<button class="pick${on ? " on" : ""}" ${attr}>${esc(label)} <b>${n}</b></button>`;
  if(mapNear){
    const pts = jobs.filter(p => p.lat), inR = pts.filter(p => distKm(near.lat, near.lng, p.lat, p.lng) <= near.km).sort((a, b) => distKm(near.lat, near.lng, a.lat, a.lng) - distKm(near.lat, near.lng, b.lat, b.lng));
    body.innerHTML = `<div class="msh"><h3>Near you</h3><div class="rad">${[10, 25, 50, 100].map(k => `<button data-km="${k}" class="${near.km === k ? "on" : ""}">${k} km</button>`).join("")}</div></div>
     <p class="maphint">${inR.length} open ${inR.length === 1 ? "post" : "posts"} within ${near.km} km. Posts are placed by town, so distances are rough.</p>${inR.length ? rowsHTML(inR.slice(0, 40)) : `<div class="empty">Nothing this close yet. Try a wider distance, or go back and tap your province.</div>`}`;
    return;
  }
  if(!mapSel){
    const inSA = SAPROV.reduce((t, k) => t + (counts[k] || 0), 0), unk = counts.unk || 0, nat = counts.nat || 0, abroad = live.filter(p => p.prov === "int").length;
    body.innerHTML = `<div class="msh"><h3>${inSA} open posts across South Africa</h3></div>
     <p class="maphint">Tap a province on the map, or pick one here, to see its towns and posts.</p>
     <div class="pickgrid">${SAPROV.filter(k => counts[k]).sort((a, b) => counts[b] - counts[a]).map(k => chip(`data-mprov="${k}"`, PNAME[k], counts[k])).join("")}</div>
     <p class="maphint">${unk ? `<a href="#/search" data-goprov="unk">${unk} ${unk === 1 ? "post does" : "posts do"} not say where the school is</a>. ` : ""}${nat ? `<a href="#/search" data-goprov="nat">${nat} cover the whole country</a>. ` : ""}${abroad ? `<a href="#/search" data-goprov="int">${abroad} are outside South Africa</a>.` : ""}</p>`;
    return;
  }
  const inProv = jobs.filter(p => p.prov === mapSel), noTown = inProv.filter(p => !p.lat);
  const spot = spots.find(s => s.id === mapSpot);
  const list = (mapSpot === "none" ? noTown : spot ? spot.list : inProv).slice().sort(byClosing);
  body.innerHTML = `<div class="msh"><h3>${PNAME[mapSel]}</h3><span class="sub">${inProv.length} open ${inProv.length === 1 ? "post" : "posts"}</span></div>
   <div class="pickgrid scroll">${chip('data-mspot=""', "All", inProv.length, !mapSpot)}${spots.map(s => chip(`data-mspot="${s.id}"`, s.name + (s.n > 1 ? " area" : ""), s.list.length, mapSpot === s.id)).join("")}${noTown.length ? chip('data-mspot="none"', "Town not given", noTown.length, mapSpot === "none") : ""}</div>
   ${list.length ? rowsHTML(list.slice(0, 40)) : `<div class="empty">No open posts here right now. New posts arrive every few days.</div>`}
   ${list.length > 40 ? `<p class="maphint"><a href="#/search" data-goprov="${mapSel}">See all ${inProv.length} in Search</a></p>` : ""}
   <p class="maphint"><button class="linkbtn" data-mback>Back to all provinces</button></p>`;
}
let mapRZ = 0;
window.addEventListener("resize", () => { clearTimeout(mapRZ); mapRZ = setTimeout(() => { if($("#map")) drawMap(false); }, 150); });
document.addEventListener("click", e => { const g = e.target.closest("[data-goprov]"); if(g){ F = {q:"", kind:"", subject:"", prov:g.dataset.goprov, town:"", phase:"", ptype:"", closing:""}; } });

/* ---------- prefs sheet ---------- */
function openPrefs(){
  const subs = [...new Set(POSTS.flatMap(p => p.subjects || []))].sort();
  const draw = () => openSheet(`<h3>Your subject and province</h3><p class="sub">Kena shows matching posts first. This stays on your phone.</p>
   <p class="lbl">Subjects you teach</p><div class="pickgrid">${subs.map(s => `<button class="pick${prefs.subjects.includes(s) ? " on" : ""}" data-ps="${esc(s)}">${esc(s)}</button>`).join("")}</div>
   <p class="lbl">Provinces you would work in</p><div class="pickgrid">${C.PROVINCES.filter(p => !["nat","unk","int"].includes(p.id)).map(p => `<button class="pick${prefs.provs.includes(p.id) ? " on" : ""}" data-pp="${p.id}">${esc(p.label)}</button>`).join("")}</div>
   <div class="actions"><button class="btn ghost" id="pClear">Clear</button><button class="btn" id="pDone">Done</button></div>`);
  draw();
  const sh = $("#sheet");
  sh.onclick = e => {
    const s = e.target.closest("[data-ps]"), p = e.target.closest("[data-pp]");
    if(s){ const v = s.dataset.ps; prefs.subjects = prefs.subjects.includes(v) ? prefs.subjects.filter(x => x !== v) : [...prefs.subjects, v]; savePrefs(); s.classList.toggle("on"); }
    if(p){ const v = p.dataset.pp; prefs.provs = prefs.provs.includes(v) ? prefs.provs.filter(x => x !== v) : [...prefs.provs, v]; savePrefs(); p.classList.toggle("on"); }
    if(e.target.closest("#pClear")){ prefs.subjects = []; prefs.provs = []; savePrefs(); draw(); }
    if(e.target.closest("#pDone")){ closeSheet(); sh.onclick = null; route(); }
  };
}

/* ---------- shared bits ---------- */
function openSheet(html){ $("#sheet").innerHTML = `<div class="grab"></div>` + html; $("#sheet").classList.add("on"); $("#scrim").classList.add("on"); }
function closeSheet(){ $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on"); }
$("#scrim").onclick = () => { closeSheet(); $("#sheet").onclick = null; };
let tt; function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("on"), 1800); }
async function copyText(t){ try { await navigator.clipboard.writeText(t); toast("Copied"); } catch { const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); toast("Copied"); } catch { toast(t); } a.remove(); } }
document.addEventListener("click", e => {
  const c = e.target.closest("[data-copy]"); if(c){ e.preventDefault(); copyText(c.dataset.copy); return; }
  const s = e.target.closest("[data-save]");
  if(s){ e.preventDefault(); toggleSave(s.dataset.save); const on = saved.has(s.dataset.save);
    if(s.hasAttribute("data-big")){ s.classList.toggle("gold", on); s.querySelector("span").textContent = on ? "Saved" : "Save"; }
    else { s.classList.toggle("on", on); s.setAttribute("aria-label", on ? "Remove from saved" : "Save this post"); }
    return; }
  if(e.target.closest("[data-you]")){ e.preventDefault(); openPrefs(); return; }
  const q = e.target.closest("[data-q]"); if(q){ location.hash = "#/search/" + q.dataset.q; }
});

/* ---------- install ---------- */
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; showInstall(); });
function showInstall(){ const b = $("#installBtn"); if(b && deferredPrompt){ b.hidden = false; b.onclick = async () => { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; b.hidden = true; }; } }
if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});

route();
</script>
